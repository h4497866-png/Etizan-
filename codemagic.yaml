workflows:
  android-build:
    name: SKY RUSH V10.3 APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install Android SDK
        script: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        script: |
          curl -fL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build APK
        script: |
          /tmp/gradle-8.11.1/bin/gradle :app:assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
