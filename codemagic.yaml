workflows:
  sky-rush-android:
    name: SKY RUSH V10.3 Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install Android SDK and Gradle
        script: |
          set -eu
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/sky-gradle.zip
          unzip -q /tmp/sky-gradle.zip -d /tmp/sky-gradle
      - name: Build installable APK
        script: |
          set -eu
          /tmp/sky-gradle/gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
