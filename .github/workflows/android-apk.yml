name: SKY RUSH Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - android-apk-build

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sky-rush-v6-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "SKY RUSH Android v6 - Build ${{ github.run_number }}" \
            --notes "Automatically built Android APK for SKY RUSH."
