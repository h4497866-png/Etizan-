name: Build SKY RUSH Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private build workspace
        uses: actions/checkout@v4

      - name: Restore Android project archive
        shell: bash
        run: |
          mkdir -p /tmp/sky-rush-input
          base64 --decode build-input/SKY_RUSH_Android_Project.zip.b64 > /tmp/sky-rush-input/project.zip
          unzip -q /tmp/sky-rush-input/project.zip -d /tmp/sky-rush-input
          cp -a /tmp/sky-rush-input/SKY_RUSH_Android/. "$GITHUB_WORKSPACE"/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKY-RUSH-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
