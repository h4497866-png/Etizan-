name: SKY RUSH Google Play Release

permissions:
  contents: write

on:
  push:
    branches:
      - android-apk-build

jobs:
  build:
    name: Build signed Google Play bundle and installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Load or create persistent Play upload key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p signing
          if gh release view sky-rush-upload-key >/dev/null 2>&1; then
            gh release download sky-rush-upload-key \
              --pattern "upload-keystore.jks" \
              --pattern "signing-credentials.txt" \
              --dir signing
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore signing/upload-keystore.jks \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias skyrush-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SKY RUSH, OU=Android, O=SKY RUSH, L=NA, ST=NA, C=TN"
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=skyrush-upload"
              echo "keyPassword=$KEY_PASSWORD"
            } > signing/signing-credentials.txt
            gh release create sky-rush-upload-key \
              signing/upload-keystore.jks signing/signing-credentials.txt \
              --title "Private SKY RUSH Play upload key" \
              --notes "Private signing material for future SKY RUSH Google Play updates. Keep confidential."
          fi

          STORE_PASSWORD="$(sed -n 's/^storePassword=//p' signing/signing-credentials.txt)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' signing/signing-credentials.txt)"
          KEY_PASSWORD="$(sed -n 's/^keyPassword=//p' signing/signing-credentials.txt)"
          test -s signing/upload-keystore.jks
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -exportcert -rfc -keystore signing/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            -file signing/upload_certificate.pem
          keytool -list -v -keystore signing/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E "SHA256:" > signing/upload_certificate_fingerprint.txt

      - name: Build signed release APK and Android App Bundle
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Verify signed release outputs
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/apk/release/app-release.apk

      - name: Publish Google Play bundle and installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sky-rush-play-${{ github.run_number }}" \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/apk/release/app-release.apk \
            signing/upload_certificate.pem \
            signing/upload_certificate_fingerprint.txt \
            --title "SKY RUSH Google Play v8 - Build ${{ github.run_number }}" \
            --notes "Signed Android App Bundle for Google Play and signed APK for direct installation. Version 8.0, min API 24, target API 36. AdMob integration uses the SKY RUSH production app and ad unit IDs configured in the Android project."
